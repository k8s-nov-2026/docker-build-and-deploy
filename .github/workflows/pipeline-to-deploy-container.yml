name: Deploy app as container
run-name: "Build and deploy docker container on vm"
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write

jobs:
  Build_docker_container_into_vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_code
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      - name: Azure login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      - name: Acr login
        uses: azure/docker-login@v2
        with:
          login-server: 'digifrontend.azurecr.io' # default: index.docker.io
          username: 'digifrontend'
          password: ${{ secrets.REG_PASSWORD }}
      - name: Build the image
        run: |
          docker build -t digifrontend.azurecr.io/digifrontend/webapp-test:${{github.sha}} .
          docker push digifrontend.azurecr.io/digifrontend/webapp-test:${{github.sha}}     

#      - name: Login into virtual machine and deploy container
#        uses: appleboy/ssh-action@v1
#        with:
#          host: "20.109.28.174"
#          username: "azureuser"
#          password: ${{ secrets.PASSWORD }}
#          port: 22
#          script: |
#            docker pull digifrontend.azurecr.io/digifrontend/webapp-test:${{github.sha}}
#            docker run -it -d --name webapp_http -p 80:80 digifrontend.azurecr.io/digifrontend/webapp-test:${{github.sha}}

  Deploy_container_into_vm:
    needs: Build_docker_container_into_vm
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      - name: Azure login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      - name: Acr login
        uses: azure/docker-login@v2
        with:
          login-server: 'digifrontend.azurecr.io' # default: index.docker.io
          username: 'digifrontend'
          password: ${{ secrets.REG_PASSWORD }}

      - name: Login into virtual machine and deploy container
        uses: appleboy/ssh-action@v1
        with:
          host: "20.109.28.174"
          username: "azureuser"
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            sudo apt -y update
            sudo apt -y install ca-certificates curl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            sudo tee /etc/apt/sources.list.d/docker.sources <<EOF
            Types: deb
            URIs: https://download.docker.com/linux/ubuntu
            Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
            Components: stable
            Architectures: $(dpkg --print-architecture)
            Signed-By: /etc/apt/keyrings/docker.asc
            EOF
            sudo apt -y update
            sudo apt -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            sudo service docker start
            sudo docker pull digifrontend.azurecr.io/digifrontend/webapp-test:${{github.sha}}
            sudo docker run -it -d --name webapp_http -p 80:80 digifrontend.azurecr.io/digifrontend/webapp-test:${{github.sha}}



